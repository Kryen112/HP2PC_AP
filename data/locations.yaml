# 13 "X Level Complete" locations (Heretic-AP model). One per level / challenge
# / boss; reaching the end IS the check. AP id = base 5760000 + id_offset, so
# id_offset = 700 + idx where idx is the clause-3 objective index the mod's
# APCardWatcher.NotifyLevelObjective fires CHECK_LOCID (5760700+idx) for.
# Detection (mod-side, no per-row data needed here):
#   idx 0-2  Mechanism A  left the terminal ingredient level (CheckExitedLevelObjective); Boomslang also early via nCount
#   idx 3    Mechanism B  ADV9ARAGOG  Aragog.IsInState('stateBeatAragog')
#   idx 4    Mechanism B  ADV12CHAMBER Basilisk.bBasilFinishedForGood
#   idx 5-6  Mechanism C  left the level (watcher per-level bind history)
#   idx 7-10 Mechanism D  left the terminal challenge level (CheckExitedLevelObjective); FinalStar NOT replaced
#   idx 11   Mechanism D  CH7GRYFFINDOR FinalStar replaced with APGryffindorEndStar (credits in EndState)
#   idx 12   Mechanism E  CH6WIZARDCARD end trigger (TriggerChangeLevel tag changelevel1) replaced with APTriggerChangeLevel
# `level`/`idx` are documentation only — the generator uses name/id_offset/
# region/group (emit_locations generic loop). Region = the level's existing
# logic region (must exist in BOTH logic_vanilla.yaml and logic_open_castle.yaml).
# Always real AP checks (no enable toggle): the open castle Great Hall levels
# clause gates on the reachability of these locations, so they must always
# exist. open_castle_goal_levels (0..13) is the only knob over how many count.
# These are NOT open-castle-only: in vanilla they are ordinary progress checks;
# the Great Hall clause-3 gate uses the same detector but only in open castle mode.
level_completions:
  - { id_offset: 700, idx: 0,  level: BoomslangLevel,  name: "Boomslang Level - Complete",        region: BoomslangLevel,    group: LevelCompletions }
  - { id_offset: 701, idx: 1,  level: BicornLevel,     name: "Bicorn Level - Complete",           region: BicornLevel,       group: LevelCompletions }
  - { id_offset: 702, idx: 2,  level: GoyleLevel,      name: "Goyle Level - Complete",            region: GoyleLevel,        group: LevelCompletions }
  - { id_offset: 703, idx: 3,  level: Adv9Aragog,      name: "Forbidden Forest - Complete",       region: ForbiddenForest,   group: LevelCompletions, notes: "Aragog defeated." }
  - { id_offset: 704, idx: 4,  level: Adv12Chamber,    name: "Chamber of Secrets - Complete",     region: ChamberOfSecrets,  group: LevelCompletions, notes: "Basilisk defeated." }
