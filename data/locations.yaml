# 274 in-world container locations (the `containersanity` option, Toggle,
# default off). Every bean / ingredient / peeves / gnome container Harry can
# open with a spell becomes a check the first time it opens: the mod swaps each
# placed instance for a thin APContainer* subclass at level bring-up that ejects
# a stamped AP token (immediate, like a card flying out of a chest) and fires
# CHECK_LOCID on pickup. Locations-only (filler pads the pool).
#
# Sourced once from the in-game DumpContainers console command (one census line
# per container in Game.log per level), then hand-folded into this block. To
# refresh after a census re-run, walk every level with DumpContainers and update
# the rows from the logged level/name/spell/lives/class fields. Card-bearing
# chests (already card locations), spell=None decorative props, and
# invisible/no-mesh spawners are left out (drop hascard=1 / spell=0 rows).
#
# Fields: `marker` is the engine actor Name the runtime resolves via
# APLocationRegistry.GetContainerLocationId(level, marker). `spell` is the
# opening spell; gen_apworld auto-derives each container's baseline logic rule
# from it (requires: <spell>). To give a container extra requirements, add an
# explicit `'<name>': { requires: "<spell> & <other>" }` under `locations:` in
# logic_vanilla.yaml / logic_open_castle.yaml; that override wins. `class` /
# `lives` / `loc` / `notes` are census provenance. BeanBonusRoom rows are
# open-castle-only (mode: open_castle; region in OPEN_CASTLE_ONLY_REGIONS).
# Id band 1024-1297, inside the widened 2048 NONCARD_LOC_WINDOW.
