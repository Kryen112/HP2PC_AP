# 13 Tradersanity vendor locations. Every
# non-Weasley card vendor (Sells_BronzeCards/SilverCards) and ingredient
# vendor (Sells_WBark/FMucus) sells one AP check on its first sale, then
# reverts to its normal item once that check is collected. Sourced from the
# runtime vendor census (vanilla + open castle walk). Vendor
# `actor.Name` is stable across level re-entry / save-load and identical
# between the vanilla and HP2 Bingo installs, so the mod keys each location on
# (level, vendor_name) exactly like secrets — APLocationRegistry gains
# GetVendorLocationId(LevelName, VendorKey). `sells` IS consumed by the
# generator (GetVendorSells): a card vendor (BronzeCards/SilverCards) is
# turned into an ingredient vendor at runtime while its check is pending —
# HP2 card-vendor stock is tier-global and a card sale spawns a real card
# (cardsanity cross-fire), whereas ingredient stock is per-vendor and spawns
# a plain prop — and restored to its card tier on collection; the mod reads
# the ORIGINAL type from here (not the mutated actor) so restore survives
# save/load. `vendor_class` / `loc` are census provenance only; the generic
# loop also uses id_offset/name/region/group.
#
# Id band 800-812: reserved inside the 800-899 band, well inside
# the 1024 NONCARD_LOC_WINDOW so the mod's NonCardLocationChecked[] dedupe
# (and thus the revert-after-sold behaviour) works. gen_apworld.py fails
# generation if any non-card offset >= the window.
#
# Generation gate: the `tradersanity` Choice (off / price_vanilla /
# price_random / price_low). Off emits zero locations. No paired items —
# these hold whatever the multiworld places (filler pads the delta).
#
# Region must exist in BOTH logic graphs: Entryhall_hub/Grandstaircase_hub
# map to Hogwarts, Grounds_hub to CastleExterior (both Sphere-0 in open castle,
# both already used by secrets/classrooms). Not all vendors are story-
# accessible in vanilla but all spawn; per-location `requires:` is authored
# in logic_vanilla.yaml / logic_open_castle.yaml.
tradersanity:
  - { id_offset: 800, name: "Entry Hall - Card Vendor 1",                   level: Entryhall_hub,       vendor_name: GOldMaleGry0, vendor_class: GOldMaleGry1, sells: BronzeCards, loc: "(-1751.78, -3153.07, 108.50)", region: EntryHall,      group: Tradersanity }
