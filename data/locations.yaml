# HP2PC_AP location catalog — source of truth.
#
# A "location" is any in-game spot the seed places an AP item. When the player
# reaches/triggers a location, the mod sends `check_sent` with the location's id.
#
# Schema:
#   id_offset     unique within the file (final id = base_id + id_offset)
#   name          stable string id (used in code; do NOT rename casually)
#   region        which region this location belongs to (regions defined in regions.yaml or here later)
#   group         grouping for YAML options (e.g. "Card Locations")
#   notes         free text — vanilla item that lives there, route hints, etc.
#
# Card regions are catalogued from an open-hub playthrough.

base_id: 5760000

# 4 spell-teaching classrooms. Each grants one of the 4 non-starter spells
# (Rictusempra, Skurge, Diffindo, Spongify). Lumos/Flipendo/Alohomora have no
# classroom location: harry.uc:335-337 adds them to every fresh Harry, so the
# only way to keep them away from the player is via the mod's Snapshot+revert
# (which wipes any spell AP hasn't granted). Whether they're starters depends
# on the `starting_spells` yaml option.
#
# Story-order in vanilla play: Lockhart#1 → Quidditch → Potions (Snape,
# brews Wiggenweld but no spell) → Flitwick → Bicorn level → Duelling Club →
# Sprout → Boomslang level → Dumbledore's study → Goyle level → Slytherin
# Common → Lockhart#2 → Forbidden Forest → Chamber → Basilisk. Sphere-0 in
# the open-hub model is "everything reachable from spawn"; the story-mode
# variant (entrance-locked) is parked. Snape's Potions class doesn't teach
# a spell so it isn't a check; the brew-Wiggenweld unlock and other story
# beats (Quidditch practice, Duelling Club, Dumbledore's study) are deferred.
#
# The mod fires `CHECK_SPELL <name>` when Harry first learns a spell; the
# client maps name → location_id via `SPELL_TO_LOCATION_NAME` in apworld/Client.py.
classrooms:
  - { id_offset: 1, name: "Learned Rictusempra", region: GrandStaircase, group: Classrooms, notes: "Lockhart's first class (story step 1) — teaches Rictusempra after the in-classroom spell challenge" }
  - { id_offset: 2, name: "Learned Skurge",      region: GrandStaircase, group: Classrooms, notes: "Flitwick's class (story step 4) — teaches Skurge after the spell challenge" }
  - { id_offset: 3, name: "Learned Diffindo",      region: CastleExterior, group: Classrooms, notes: "Sprout's Herbology class (story step 7) — teaches Diffindo after the spell challenge" }
  - { id_offset: 4, name: "Learned Spongify",    region: GrandStaircase, group: Classrooms, notes: "Lockhart's second class (story step 12) — teaches Spongify after the spell challenge. Shares the DADA room with Rictusempra so a bookcase here is hard to deploy without blocking Rictusempra too." }

# Special progression checks were here in earlier drafts (Special_Boomslang /
# _Bicorn / _BitOGoyle). Removed — Boomslang, Bicorn, and BitOGoyle are
# left to vanilla story progression and are not AP items/locations. The card
# locations inside Bicorn/Boomslang/Goyle levels remain. Add these back when
# the key-item flow is reliable end-to-end (mod hook for goyle-bump, vendor
# behaviour, etc).
special_checks: []

# 2 vendor-purchase locations on the Castle Exterior grounds. The check
# fires when Harry pays Fred (Nimbus 2001) or George (Quidditch Armour).
# Each twin's vendor slot is visually swapped from its vanilla item drop
# (VendorNimbusBroom or QArmor actor) to APCardMarker_PHCard with the
# location's id baked in; the on-ground drop + pickup animation look like a
# normal card pickup, so the player sees an AP-flavoured pickup instead of
# the unique vanilla item. `vendor_class` is the in-level Characters subclass
# whose MakePurchase fires the sale; `vanilla_sells` is the matching
# ESells enum value from Characters.uc so the watcher knows which Characters
# instance to scan for sale events.
#
# Spawn gate: Fred and George don't appear on the Castle Exterior grounds
# until Harry has Rictusempra (vanilla story gate — they're keyed to the
# post-Lockhart-class state). Logic for both locations therefore requires
# Rictusempra on top of the CastleExterior region entry (Lumos & Flipendo).
#
# Generation gate: both locations live behind the `enable_quidditch_upgrades`
# YAML option (Toggle, default off). When the option is false the locations
# aren't emitted at all and Fred/George keep their vanilla item drop. The
# option ALSO gates the matching `equipment` items in data/items.yaml
# (Nimbus 2001 / Quidditch Armour at items 8/9) — gen_apworld.py MUST drop
# both the items and these locations together, otherwise the pool has 2
# orphan items with no homes. The pairing is items 8/9 ↔ locations 5/6.
#
# Mod wiring: when enable_quidditch_upgrades is on, APCardWatcher.Replace-
# VendorEquipment morphs the VendorNimbusBroom / QArmor that MakePurchase
# throws IN PLACE into the location's AP pickup token (nulls its grant fields,
# applies the AP appearance, keeps the vanilla throw arc). The check fires when
# Harry picks the token up; NonCardLocationChecked dedupes it. Harry keeps the
# bHaveNimbus2001 / bHaveQArmor flag MakePurchase set (so the vendor stops
# offering), but the token grants no item; the AP grant elsewhere in the seed
# populates the real equipment. When the option is off the morph is skipped and
# Fred/George keep their vanilla drop.
quidditch_purchases:
  - { id_offset: 5, name: "Castle Exterior - Nimbus 2001",      vendor_class: FredWeasley,   vanilla_sells: Sells_Nimbus2001, region: CastleExterior, group: QuidditchPurchases, notes: "Fred Weasley sells the Nimbus broom for ~700 beans on the Castle Exterior grounds. Vendor only spawns after Harry has Rictusempra. AP morphs the thrown VendorNimbusBroom in place into a pickup token; the check fires when Harry picks it up." }
  - { id_offset: 6, name: "Castle Exterior - Quidditch Armour", vendor_class: GeorgeWeasley, vanilla_sells: Sells_QArmor,     region: CastleExterior, group: QuidditchPurchases, notes: "George Weasley sells the Quidditch armour. Vendor only spawns after Harry has Rictusempra. AP morphs the thrown QArmor in place into a pickup token; the check fires when Harry picks it up." }

# 10 duel-win locations at the Duelling Club, one per ranked duel. Each check
# fires when Harry wins the corresponding Duel0N standalone level. `duel_rank`
# (1..10) is the stable handle used by the win-detection watcher to resolve
# which AP location maps to a given TriggerEvent('HarryWonDuel') firing —
# vanilla `harry.DuelRankHarry` carries the rank Harry just defeated.
# `duel_level` is the source .unr file so the catalogue is grep-able.
#
# Generation gate: `enable_duelling` YAML option (Toggle, default false).
# When false the 10 locations aren't emitted and duel wins fire no AP check.
# Locations only — no paired items are added to the pool (these checks hold
# whatever AP places at them, like cards or secrets do).
#
# Vanilla gate: duels unlock at `iGameState >= 80` (post-Bicorn), with a
# blacklist of mid-story states `[120, 150, 160, 170]` where the duelling
# room is taken over by story beats. AP logic encodes the post-Bicorn floor
# via the DuellingClub region entry; intra-system rank ordering is left to
# vanilla gameplay (per the "spell/item requires only" decision — AP doesn't
# enforce 'must win Rank N-1 before Rank N').
#
# Per-rank requires live in the logic files. Higher-rank duels may need
# additional spells beyond Rictusempra; exact per-rank gating is to be
# confirmed.
#
# Mod wiring (planned for the watcher-wiring session alongside secrets/stars):
#   - A listener actor with Tag='HarryWonDuel' (matching Duellist's default
#     WonEventName) catches TriggerEvent dispatch from `Duellist.HarryWonDuel`
#     (Duellist.uc:588), reads `harry.DuelRankHarry`, fires CHECK via
#     APIPCActor for the corresponding duel_rank's location id.
#   - DuelLocationChecked[11] (1-indexed) dedupes per-rank so re-entering a
#     Duel0N level after AP check doesn't refire (duels are replayable in
#     vanilla once won, but the AP check only counts the first win).
duels:
  - { id_offset: 600, name: "Duelling Club - Duel Rank 1",  duel_rank: 1,  duel_level: Duel01, region: DuellingClub, group: Duels, notes: "Lowest-tier duel. ~10 beans reward in vanilla." }
  - { id_offset: 601, name: "Duelling Club - Duel Rank 2",  duel_rank: 2,  duel_level: Duel02, region: DuellingClub, group: Duels }
  - { id_offset: 602, name: "Duelling Club - Duel Rank 3",  duel_rank: 3,  duel_level: Duel03, region: DuellingClub, group: Duels }
  - { id_offset: 603, name: "Duelling Club - Duel Rank 4",  duel_rank: 4,  duel_level: Duel04, region: DuellingClub, group: Duels }
  - { id_offset: 604, name: "Duelling Club - Duel Rank 5",  duel_rank: 5,  duel_level: Duel05, region: DuellingClub, group: Duels }
  - { id_offset: 605, name: "Duelling Club - Duel Rank 6",  duel_rank: 6,  duel_level: Duel06, region: DuellingClub, group: Duels }
  - { id_offset: 606, name: "Duelling Club - Duel Rank 7",  duel_rank: 7,  duel_level: Duel07, region: DuellingClub, group: Duels }
  - { id_offset: 607, name: "Duelling Club - Duel Rank 8",  duel_rank: 8,  duel_level: Duel08, region: DuellingClub, group: Duels }
  - { id_offset: 608, name: "Duelling Club - Duel Rank 9",  duel_rank: 9,  duel_level: Duel09, region: DuellingClub, group: Duels }
  - { id_offset: 609, name: "Duelling Club - Duel Rank 10", duel_rank: 10, duel_level: Duel10, region: DuellingClub, group: Duels, notes: "Highest-tier duel. ~200 beans reward in vanilla." }

# 6 Quidditch match win locations. Vanilla `harry.curQuidMatchNum` tracks
# match index 0..5 and `harry.quidGameResults[match_index].bWon` is set True
# at win. `match_index` here is the same index AP uses to identify which
# match was just won. Opponent cycle (vanilla): Hufflepuff, Ravenclaw,
# Slytherin, Hufflepuff, Ravenclaw, Slytherin. Match 6 (index 5) is the
# final match and fires `MatchEvents_Final.Won` instead of `MatchEvents.Won`.
#
# Generation gate: `enable_quidditch_matches` YAML option (Toggle,
# default false). When false the 6 locations aren't emitted and match wins
# fire no AP check. Locations only — no paired items in the pool.
#
# Per-match requires live in the logic files. Matches unlock further into
# the story in vanilla; later matches may need Skurge / Diffindo / Spongify
# on top of the Rictusempra floor in the Quidditch region entry. Exact
# per-match gating is to be confirmed.
#
# Mod wiring (planned for the watcher-wiring session):
#   - Watcher subscribes to BOTH TriggerEvent(MatchEvents.Won) and
#     TriggerEvent(MatchEvents_Final.Won) from QuidditchDirector (the event
#     names are configurable name-vars on the director, so the listener
#     uses Tag-matching on the runtime name values pulled at level entry —
#     or, more robustly, polls `harry.quidGameResults[i].bWon` on its tick
#     and fires CHECK on the False→True transition for any match_index).
#   - MatchLocationChecked[6] dedupes per-match so post-win level reload
#     doesn't refire.
quidditch_matches:
  - { id_offset: 620, name: "Quidditch - Match 1 (Hufflepuff)", match_index: 0, opponent: Hufflepuff, region: Quidditch, group: QuidditchMatches, notes: "First match." }
  - { id_offset: 621, name: "Quidditch - Match 2 (Ravenclaw)",  match_index: 1, opponent: Ravenclaw,  region: Quidditch, group: QuidditchMatches }
  - { id_offset: 622, name: "Quidditch - Match 3 (Slytherin)",  match_index: 2, opponent: Slytherin,  region: Quidditch, group: QuidditchMatches }
  - { id_offset: 623, name: "Quidditch - Match 4 (Hufflepuff)", match_index: 3, opponent: Hufflepuff, region: Quidditch, group: QuidditchMatches }
  - { id_offset: 624, name: "Quidditch - Match 5 (Ravenclaw)",  match_index: 4, opponent: Ravenclaw,  region: Quidditch, group: QuidditchMatches }
  - { id_offset: 625, name: "Quidditch - Match 6 (Slytherin)",  match_index: 5, opponent: Slytherin,  region: Quidditch, group: QuidditchMatches, notes: "Final match. Fires MatchEvents_Final.Won instead of MatchEvents.Won; watcher must subscribe to both event names." }

# 4 spell-challenge "beat par time" locations, one per spell challenge. Each
# fires when its challenge is Mastered: replaying a challenge runs a countdown-
# score timer and `ChallengeScoreManager.EndState()`
# (HGame/Classes/HUD/ChallengeScoreManager.uc:587) sets bMastered=True once
# nHighScore >= nMaxScore, where nMaxScore is the par. The best score and the
# par persist per-challenge in `harry.ChallengeScores[4]` (var travel array,
# harry.uc:305; struct ChallengeScoreType {nHighScore, nMaxScore} at
# harry.uc:12-16), so a Mastered challenge survives save/load exactly like
# `quidGameResults` for Quidditch. `challenge_index` is the stable handle into
# that array: 0=Rictusempra, 1=Skurge, 2=Diffindo, 3=Spongify.
#
# Generation gate: `enable_spell_challenge_times` YAML option (Toggle, default
# false — optional skill content, mirroring enable_duelling /
# enable_quidditch_matches). When false the 4 locations aren't emitted and
# Mastering a challenge fires no AP check. Locations only — no paired items in
# the pool (these checks hold whatever AP places at them, like cards do).
#
# Per-challenge requires live in data/logic_vanilla.yaml /
# data/logic_open_castle.yaml. The 4 challenge regions already exist
# (RictusempraChallenge / SkurgeChallenge / DiffindoChallenge /
# SpongifyChallenge), so rules attach per-location.
#
# Mod wiring: APCardWatcher.ScanChallengeMastery polls harry.ChallengeScores
# each tick (same poll pattern as ScanMatchWins / ScanDuelWins, no new bridge
# message). It fires CHECK for challenge i when nHighScore >= nMaxScore with an
# `nMaxScore > 0` guard so a never-played challenge (0/0) cannot false-fire.
# NonCardLocationChecked[slot] (slot = id - LOC_BASE) dedupes per-challenge so
# re-entering the challenge level after the AP check, or a save-load, does not
# refire (challenges are replayable in vanilla, but the AP check counts the
# first Master).
spell_challenge_times:
  - { id_offset: 630, name: "Rictusempra Challenge - Beat Par Time", challenge_index: 0, region: RictusempraChallenge, group: SpellChallengeTimes, notes: "Fires when ChallengeScores[0] is Mastered (nHighScore >= nMaxScore, nMaxScore > 0)." }
  - { id_offset: 631, name: "Skurge Challenge - Beat Par Time",      challenge_index: 1, region: SkurgeChallenge,      group: SpellChallengeTimes }
  - { id_offset: 632, name: "Diffindo Challenge - Beat Par Time",    challenge_index: 2, region: DiffindoChallenge,    group: SpellChallengeTimes }
  - { id_offset: 633, name: "Spongify Challenge - Beat Par Time",    challenge_index: 3, region: SpongifyChallenge,    group: SpellChallengeTimes }

