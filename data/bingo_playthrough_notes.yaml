# Bingo playthrough observation notes.
#
# Walk to every check in-game with all 7 spells precollected (use the
# `hp2_allspells/playtest.yaml` slot + bingo install + debug mode to bypass
# bookcase keys). For each location, replace TBD with the spell/item
# combo you actually had to use to physically reach it.
#
# Grammar (same as logic_bingo.yaml):
#   - "true"                              no extra requirement beyond region entry
#   - "Lumos & Flipendo"                  AND of items
#   - "Spongify | Rictusempra"            OR
#   - "(Flipendo & Lumos) | Diffindo"     paren grouping
#   - "TBD"                               leave for later (generates as always-reachable)
#
# Once filled in, the entries here get migrated into data/logic_bingo.yaml
# under the `locations:` section. Classroom checks are listed for
# completeness but are dropped from bingo seeds entirely.

