# HP2PC_AP per-location access rules — source of truth.
#
# Every location in data/locations.yaml gets exactly one rule entry here.
# Rules express: "you can reach this location if you have these items."
#
# Schema:
#   <LocationName>:
#     requires: <expr>          # required items expression (see grammar below)
#     region:   <RegionName>    # what region you must be in (entry rule of region)
#     notes:    <free text>     # optional, why this rule, playtest observations
#
# Grammar for `requires`:
#   - "Flipendo"                       single item
#   - "Flipendo & Lumos"               AND
#   - "Flipendo | Alohomora"           OR
#   - "(Flipendo & Lumos) | BitOGoyle" parens + mix
#   - "true"                           always reachable from region (no extra requirement)
#   - "false"                          never reachable (placeholder during scaffolding)
#
# Authoring approach:
#   1. Generate a seed with `start_inventory_from_pool: all` (the AP "unlock everything"
#      option) and play through. Note which locations were physically blocked by what.
#   2. Encode each observation as a rule here.
#   3. Re-run scripts/gen_apworld.py to project rules.yaml into apworld/rules.py.
#   4. Generate a normal (non-unlock-all) seed; verify it's solvable.
#   5. Iterate.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:                       # AP-standard start region; only edge out is to Hogwarts
    entry: "true"
    start: true
  Hogwarts:
    entry: "true"             # castle interior/hub, classrooms + grand staircase
    notes: "Refine — some hub-internal doors may need spells in playtest"
  Greenhouses:
    entry: "true"             # Sprout's herbology classroom
  WhompingWillow:
    entry: "Lumos & Flipendo & Alohomora"
    notes: "Per design conversation — verify in playtest"
  RictusempraChallenge:
    entry: "Rictusempra"
  SkurgeChallenge:
    entry: "Skurge"
  DiffindoChallenge:
    entry: "Diffindo"
  SpongifyChallenge:
    entry: "Spongify"
  ForbiddenForest:
    entry: "TBD"
  Quidditch:
    entry: "TBD"
  BicornLevel:
    entry: "TBD"              # what's the entry req? Bicorn-the-key or just walking in?
  BoomslangLevel:
    entry: "TBD"
  GoyleLevel:
    entry: "TBD"
  SlytherinCommon:
    entry: "BitOGoyle"
  ChamberOfSecrets:
    entry: "Flipendo & Lumos & Alohomora & Diffindo & Rictusempra & Skurge & Spongify"
    notes: "Final goal region. All-spells gate is one option; 'all challenges cleared' is another. TBD."

# Per-location rules. KEY = location.name from locations.yaml.
# Default scaffolding sets `requires: true` (= just region access). Refine during playtest.
locations:
  # 4 spell classrooms. Entering grants the spell via vanilla cutscene; the
  # CHECK_SPELL fires at that moment. Region access is "true" (Hogwarts +
  # Greenhouses are sphere-0 in the open-hub model). Lumos/Flipendo/Alohomora
  # are start-inventory and have no classroom location (resolved DESIGN Q7).
  Classroom_Lockhart_Rictusempra: { region: Hogwarts,    requires: "true" }
  Classroom_Flitwick_Skurge:      { region: Hogwarts,    requires: "true" }
  Classroom_Sprout_Diffindo:      { region: Greenhouses, requires: "true" }
  Classroom_Lockhart_Spongify:    { region: Hogwarts,    requires: "true" }

  # Special progression checks. These are concrete pickups/interactions, not
  # level clears.
  Special_Boomslang: { region: BoomslangLevel, requires: "true", notes: "AP marker/icon at vanilla Boomslang pickup" }
  Special_Bicorn:    { region: BicornLevel,    requires: "true", notes: "AP marker/icon at vanilla Bicorn pickup" }
  Special_BitOGoyle: { region: GoyleLevel,     requires: "true", notes: "Goyle end interaction/touch; no vanilla pickup item" }

  # 101 card locations are NOT enumerated here. The generator will default any
  # location not listed above to {region: <whatever locations.yaml says>, requires: "true"}.
  # Add an entry below ONLY when a card needs a per-location rule (e.g. behind
  # a Lumos wall in a region the player can otherwise access freely).
  #
  # Example future entry:
  #   Card_Agrippa: { region: ForbiddenForest, requires: "Diffindo", notes: "Behind a vine wall" }
  #
  # Cards whose `region` in locations.yaml is still TBD will block generation
  # until you fill them in (during playtest). The generator surfaces those as
  # an error listing exactly which Card_* entries are missing regions.

# Goal definition.
goal:
  basilisk:
    requires: "Flipendo & Lumos & Alohomora & Diffindo & Rictusempra & Skurge & Spongify"
    notes: "Generation logic for reaching Basilisk/credits. Runtime completion still comes from GOAL_COMPLETE."
