# HP2PC_AP per-location access rules — source of truth.
#
# Every location in data/locations.yaml gets exactly one rule entry here.
# Rules express: "you can reach this location if you have these items."
#
# Schema:
#   <LocationName>:
#     requires: <expr>          # required items expression (see grammar below)
#     region:   <RegionName>    # what region you must be in (entry rule of region)
#     notes:    <free text>     # optional, why this rule, playtest observations
#
# Grammar for `requires`:
#   - "Flipendo"                       single item
#   - "Flipendo & Lumos"               AND
#   - "Flipendo | Alohomora"           OR
#   - "(Flipendo & Lumos) | BitOGoyle" parens + mix
#   - "true"                           always reachable from region (no extra requirement)
#   - "false"                          never reachable (placeholder during scaffolding)
#
# Authoring approach:
#   1. Generate a seed with `start_inventory_from_pool: all` (the AP "unlock everything"
#      option) and play through. Note which locations were physically blocked by what.
#   2. Encode each observation as a rule here.
#   3. Regenerate the apworld/*.py from data/*.yaml.
#   4. Generate a normal (non-unlock-all) seed; verify it's solvable.
#   5. Iterate.
#
# Items Lumos / Flipendo / Alohomora are precollected starters today. Lumos
# and Flipendo are encoded in every downstream region's entry rule because
# Stefan's playtest note: "EVERY LOCATION NEEDS LUMOS AND FLIPENDO, otherwise
# we cannot progress through willow." Alohomora is also a starter today but
# listed explicitly per-location/region wherever Stefan observed it being
# required — Stefan plans to expose an "Alohomora-not-starter" YAML option,
# so the logic needs to be honest about which locations actually depend on it.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:
    entry: "true"
    start: true

  WhompingWillow:
    entry: "true"
    notes: "Starting level. Player walks out the other side into Hogwarts."

  Hogwarts:
    entry: "Lumos & Flipendo"
    notes: "Castle interior hub — grand staircase, Lockhart's DADA classroom (Rictusempra + Spongify lessons), Flitwick's classroom (Skurge), entrance hall, library. Lumos+Flipendo gate is the willow exit. Alohomora not in entry because Toothill/Oldridge don't need it; per-location elsewhere."

  CastleExterior:
    entry: "Lumos & Flipendo"
    notes: "Outdoor courtyard between castle and greenhouses. Alohomora not in entry because Sweeting/Sykes don't need it; per-location elsewhere."

  RictusempraChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra"
    notes: "Auto-teleport from Lockhart's classroom after the Rictusempra bookcase clears. All 9 cards inside require Alohomora — encoded at region level."

  Quidditch:
    entry: "Lumos & Flipendo & Rictusempra"
    notes: "Quidditch training opens after Rictusempra challenge. Bean bonus room en route — no checks there. Fred/George vendor (Nimbus 2001, Quidditch armour) and Quidditch matches 1-6 are v2 Tier-3 expansion candidates."

  SkurgeChallenge:
    entry: "Lumos & Flipendo & Rictusempra & Skurge"
    notes: "Auto-teleport from Flitwick's classroom after the Skurge bookcase clears (bookcase TODO). Alohomora not at region entry because Skurge Challenge - Card Gregory doesn't need it; per-location for the other 5."

  BicornLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge"
    notes: "Bicorn horn collection level. Reached after Skurge challenge completion. v1: Bicorn itself is vanilla-only, not an AP item. All 6 cards inside require Alohomora. Dueling unlocks on completion (v2 Tier-3 candidate)."

  DuelingClub:
    entry: "Lumos & Flipendo & Rictusempra & Skurge"
    notes: "Dueling Club opens post-Bicorn (vanilla iGameState >= 80). 10 ranked duels (Rank 1-10) each fire an AP check on win. Region entry mirrors BicornLevel minus Alohomora (no locks to pick in the dueling room). v2 Tier-3 expansion, opt-in via enable_duelling (default off). Intra-rank ordering not encoded in logic per the 'spell/item requires only' rule — vanilla gameplay enforces sequential rank progression on its own."

  DiffindoChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Auto-teleport from Sprout's classroom after the Diffindo bookcase clears (bookcase TODO). All 8 cards inside require Alohomora."

  BoomslangLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Boomslang skin collection level. Reached after Diffindo challenge. v1: Boomslang itself is vanilla-only, not an AP item. Both cards require Alohomora."

  DumbledoreStudy:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Visited between Boomslang skin level and Goyle level. Story gate, not spell gate. Both cards require Alohomora."

  GoyleLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Reached after Dumbledore's study. v1: BitOGoyle fragment at end is vanilla-only, not an AP check. All 6 cards require Alohomora."

  SlytherinCommon:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Reached via Moaning Myrtle bathroom + Polyjuice transformation. v1: Polyjuice ingredients (Boomslang/Bicorn/BitOGoyle) are vanilla-only — story progression guarantees the player has them by the time they enter SlytherinCommon. All 5 cards require Alohomora."

  SpongifyChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify"
    notes: "Auto-teleport from Lockhart's classroom (DADA). No bookcase on the room because Rictusempra also lives here — Stefan's note: 'i cant place a bookcase there to block it yet'. All 8 cards require Alohomora."

  ForbiddenForest:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify"
    notes: "All 6 cards require Alohomora."

  ChamberOfSecrets:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify"
    notes: "Final goal region. All 4 non-starter spells required for traversal and Basilisk; Alohomora at region entry too. Hosts Chamber of Secrets - Card Elphick only — the 11 Gold cards moved to GoldCardRoom 2026-05-13 (correct vanilla home is Ch6WizardCard, not the Chamber level)."

  GoldCardRoom:
    entry: "Lumos & Flipendo"
    notes: "Ch6WizardCard.unr — the gold card vault, reached via a door in the Grand Staircase (Hogwarts sub-area), so the region entry mirrors Hogwarts (Lumos & Flipendo only) rather than the full-spell endgame gate. The vanilla 40-silver-card door (=4 Gold keys at 10 silvers each) is modelled in HP2World.set_rules as a Python-side add_rule that ANDs `state.has(every silver, player)` onto each gold-card location; the rule grammar itself can't express group counts. Per-card spell requirements inside the room are TBD pending a full playthrough — most gold cards may need additional spells to physically reach within the room."

# Per-location rules. KEY = location.name from locations.yaml.
# A location's effective rule is: region.entry AND location.requires.
# Many locations are "true" implicitly (just region access); only listed
# here when an extra requirement applies beyond the region entry.
locations:
  # ── Classrooms ─────────────────────────────────────────────────────────────
  # Each spell classroom has a bookcase (real or planned) requiring the spell
  # taught there, plus all earlier spells. The seed must place that spell at
  # some reachable location elsewhere for the bookcase to ever clear.
  "Learned Rictusempra":
    {
      requires: "Rictusempra",
      notes: "Bookcase removed when AP grants Rictusempra (already implemented). Alohomora not required per Stefan's playtest.",
    }
  "Learned Skurge":
    { requires: "Rictusempra & Skurge", notes: "Bookcase to be implemented. Alohomora not required per Stefan's playtest." }
  "Learned Diffindo":
    {
      requires: "Alohomora & Rictusempra & Skurge & Diffindo",
      notes: "Bookcases to be implemented.",
    }
  "Learned Spongify":
    {
      requires: "Alohomora & Rictusempra & Skurge & Diffindo",
      notes: "Shares the DADA room with Rictusempra so a dedicated bookcase is impractical. Spongify itself is taught here so cannot gate.",
    }

  # ── Hogwarts cards (region entry: Lumos & Flipendo) ────────────────────────
  # Most need Alohomora; Toothill/Oldridge are the exceptions (Spongify only).
  "Hogwarts - Card Sawbridge": { requires: "Alohomora" }
  "Hogwarts - Card Andros": { requires: "Alohomora" }
  "Hogwarts - Card Dodderidge": { requires: "Alohomora" }
  "Hogwarts - Card Ethelred": { requires: "Alohomora" }
  "Hogwarts - Card Maeve": { requires: "Alohomora" }
  "Hogwarts - Card Hipworth": { requires: "Alohomora" }
  "Hogwarts - Card Bonham": { requires: "Alohomora" }
  "Hogwarts - Card Wright": { requires: "Alohomora & Diffindo" }
  "Hogwarts - Card Barkwith": { requires: "Alohomora & Rictusempra" }
  "Hogwarts - Card Blane": { requires: "Alohomora & Rictusempra & Skurge" }
  "Hogwarts - Card Vablatsky": { requires: "Alohomora & Rictusempra & Skurge" }
  "Hogwarts - Card Mopsus": { requires: "Alohomora & Skurge & Diffindo" }
  "Hogwarts - Card Alderton": { requires: "Alohomora & Spongify" }
  "Hogwarts - Card Lufkin": { requires: "Alohomora & Skurge & Diffindo & Spongify" }
  "Hogwarts - Card Toothill": { requires: "Spongify" }
  "Hogwarts - Card Oldridge": { requires: "Spongify" }
  "Hogwarts - Card Jones": { requires: "Alohomora & Diffindo" }

  # ── CastleExterior cards (region entry: Lumos & Flipendo) ──────────────────
  # Most need Alohomora; Sweeting (no extra) and Sykes (Spongify only) are exceptions.
  "Castle Exterior - Card Wadcock": { requires: "Alohomora" }
  "Castle Exterior - Card Sykes": { requires: "Spongify" }
  "Castle Exterior - Card Twonk": { requires: "Alohomora & Diffindo" }
  "Castle Exterior - Card Plunkett": { requires: "Alohomora & Diffindo" }
  "Castle Exterior - Card Pokeby": { requires: "Alohomora & Rictusempra & Skurge" }
  "Castle Exterior - Card Youdle": { requires: "Alohomora & Rictusempra & Skurge" }
  "Castle Exterior - Card Marjoribanks": { requires: "Alohomora & Rictusempra & Skurge" }
  "Castle Exterior - Card Oglethorpe":
    {
      requires: "Alohomora & Spongify & Diffindo",
      notes: "High-altitude perch in the courtyard; reachable in daytime grounds too (was originally placed in a HogwartsNight region — there is no day/night distinction for checks).",
    }

  # ── Former Dungeons cards (now in Hogwarts; Rictusempra folded into per-location
  # requires since Hogwarts entry doesn't include it). All 4 need Alohomora per
  # Stefan's playtest.
  "Hogwarts - Card Gunhilda": { requires: "Alohomora & Rictusempra" }
  "Hogwarts - Card Shingleton": { requires: "Alohomora & Skurge & Rictusempra" }
  "Hogwarts - Card Montmorency": { requires: "Alohomora & Skurge & Rictusempra" }
  "Hogwarts - Card Wendelin": { requires: "Alohomora & Skurge & Diffindo & Rictusempra" }

  # ── SkurgeChallenge cards (region entry already requires Rictusempra+Skurge) ─
  # 5 of 6 need Alohomora; Skurge Challenge - Card Gregory is the exception.
  "Skurge Challenge - Card Wenlock": { requires: "Alohomora" }
  "Skurge Challenge - Card Catchlove": { requires: "Alohomora" }
  "Skurge Challenge - Card Belby": { requires: "Alohomora" }
  "Skurge Challenge - Card Fulbert": { requires: "Alohomora" }
  "Skurge Challenge - Card Kegg": { requires: "Alohomora" }

  # ── Quidditch vendor purchases on Castle Exterior grounds ─────────────────
  # Region entry: Lumos & Flipendo (CastleExterior). Fred and George don't
  # spawn until Harry has Rictusempra (vanilla story gate keyed to the
  # post-Lockhart-class state), so per-location requires adds Rictusempra
  # on top of region entry. Bean balance is currency, not a logic item.
  "Castle Exterior - Nimbus 2001": { requires: "Rictusempra" }
  "Castle Exterior - Quidditch Armour": { requires: "Rictusempra" }

  # ── Dueling Club ranked duels (region entry already requires Lumos+Flipendo+Rictusempra+Skurge) ─
  # Placeholder `requires: "true"` per duel. Real per-rank gating to be
  # filled during Stefan's playthrough — higher-rank duels may need spells
  # / items the floor doesn't have. Vanilla enforces sequential rank
  # progression in gameplay; AP doesn't model intra-system ordering per the
  # "spell/item requires only" decision, but each rank's actual spell
  # requirement will be observed and encoded after the playthrough.
  "Dueling Club - Duel Rank 1":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 2":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 3":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 4":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 5":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 6":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 7":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 8":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 9":  { requires: "Rictusempra & Skurge & Alohomora" }
  "Dueling Club - Duel Rank 10":  { requires: "Rictusempra & Skurge & Alohomora" }

  # ── Quidditch matches (region entry already requires Lumos+Flipendo+Rictusempra) ─
  # Placeholder `requires: "true"` per match. Real per-match gating to be
  # filled during Stefan's playthrough — matches unlock further into the
  # story (likely keyed to iGameState progression / story-spell ownership),
  # so later matches may need Skurge / Diffindo / Spongify on top of region
  # entry. Nimbus 2001 / Quidditch Armour are "useful" not "required" per
  # their classification, so they don't appear in the gating expressions.
  "Quidditch - Match 1 (Hufflepuff)": { requires: "Rictusempra" }
  "Quidditch - Match 2 (Ravenclaw)": { requires: "Rictusempra & Skurge" }
  "Quidditch - Match 3 (Slytherin)": { requires: "Rictusempra & Skurge & Alohomora" }
  "Quidditch - Match 4 (Hufflepuff)": { requires: "Rictusempra & Skurge & Diffindo & Alohomora" }
  "Quidditch - Match 5 (Ravenclaw)": { requires: "Rictusempra & Skurge & Diffindo & Spongify & Alohomora" }
  "Quidditch - Match 6 (Slytherin)": { requires: "Rictusempra & Skurge & Diffindo & Spongify & Alohomora" }

  # ── Gold Card Room cards (region entry: Lumos & Flipendo via Grand Staircase) ─
  # The Python-side add_rule silver-gate (all 40 silvers required) ANDs onto
  # each of these in HP2World.set_rules, so the effective rule per card is
  # region entry AND (per-location requires below) AND (all 40 silvers).
  # Level is replayable infinitely once the silver gate is met — picking up
  # already-AP-checked gold cards on replay fires no-op CHECKs (deduped).
  # `(Rictusempra | Spongify)` captures the two alternate routes through the
  # vault (Rictusempra-strike or Spongify-bounce) the player can use.
  "Gold Card Room - Card Bott":       { requires: "Rictusempra | Spongify" }
  "Gold Card Room - Card Dumbledore": { requires: "Alohomora & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Gryffindor": { requires: "Alohomora & Diffindo & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Herpo":      { requires: "Alohomora & Diffindo & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Slytherin":  { requires: "Alohomora & Diffindo & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Hufflepuff": { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Knightley":  { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Paracelsus": { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Pinkstone":  { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Ravenclaw":  { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }
  "Gold Card Room - Card Potter":     { requires: "Alohomora & Diffindo & Skurge & (Rictusempra | Spongify)" }

  # All other cards inherit their region's entry rule (which now includes
  # Alohomora for the universally-locked regions: RictusempraChallenge,
  # BicornLevel, DiffindoChallenge, BoomslangLevel, DumbledoreStudy, GoyleLevel,
  # SlytherinCommon, SpongifyChallenge, ForbiddenForest, ChamberOfSecrets).
  # Whomping Willow - Card Starkey (WhompingWillow), Skurge Challenge - Card Gregory (SkurgeChallenge),
  # Castle Exterior - Card Sweeting (CastleExterior), Hogwarts - Card Toothill/Hogwarts - Card Oldridge (Hogwarts) are
  # the no-Alohomora-required outliers.

# Goal definition.
goal:
  basilisk:
    requires: "Flipendo & Lumos & Alohomora & Diffindo & Rictusempra & Skurge & Spongify"
    notes: "Generation logic for reaching Basilisk/credits. Runtime completion still comes from GOAL_COMPLETE."
