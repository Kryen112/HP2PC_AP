# HP2PC_AP per-location access rules — source of truth.
#
# Every location in data/locations.yaml gets exactly one rule entry here.
# Rules express: "you can reach this location if you have these items."
#
# Schema:
#   <LocationName>:
#     requires: <expr>          # required items expression (see grammar below)
#     region:   <RegionName>    # what region you must be in (entry rule of region)
#     notes:    <free text>     # optional, why this rule, playtest observations
#
# Grammar for `requires`:
#   - "Flipendo"                       single item
#   - "Flipendo & Lumos"               AND
#   - "Flipendo | Alohomora"           OR
#   - "(Flipendo & Lumos) | BitOGoyle" parens + mix
#   - "true"                           always reachable from region (no extra requirement)
#   - "false"                          never reachable (placeholder during scaffolding)
#
# Authoring approach:
#   1. Generate a seed with `start_inventory_from_pool: all` (the AP "unlock everything"
#      option) and play through. Note which locations were physically blocked by what.
#   2. Encode each observation as a rule here.
#   3. Regenerate the apworld/*.py from data/*.yaml.
#   4. Generate a normal (non-unlock-all) seed; verify it's solvable.
#   5. Iterate.
#
# Items Lumos / Flipendo / Alohomora are precollected starters today. Lumos
# and Flipendo are encoded in every downstream region's entry rule because
# Stefan's playtest note: "EVERY LOCATION NEEDS LUMOS AND FLIPENDO, otherwise
# we cannot progress through willow." Alohomora is also a starter today but
# listed explicitly per-location/region wherever Stefan observed it being
# required — Stefan plans to expose an "Alohomora-not-starter" YAML option,
# so the logic needs to be honest about which locations actually depend on it.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:
    entry: "true"
    start: true

  WhompingWillow:
    entry: "'Whomping Willow Key'"
    notes: "Starting level. Player walks out the other side into Hogwarts. Bingo key auto-precollected in vanilla mode."

  Hogwarts:
    entry: "true"
    notes: "Castle interior hub — grand staircase, Lockhart's DADA classroom (Rictusempra + Spongify lessons), Flitwick's classroom (Skurge), entrance hall, library. Sphere-0 in bingo (open castle, walkable with no spells). In vanilla, Lumos+Flipendo are precollected starters so the physical Willow→Hogwarts gate is trivially passed regardless; per-card requires handle individual spell gating."

  CastleExterior:
    entry: "true"
    notes: "Outdoor courtyard between castle and greenhouses. Sphere-0 in bingo (open castle). In vanilla, Lumos+Flipendo are precollected starters so the prior 'Lumos & Flipendo' entry was trivially passed; per-card requires gate individual checks by spell."

  RictusempraChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & 'Rictusempra Challenge Key'"
    notes: "Auto-teleport from Lockhart's classroom after the Rictusempra bookcase clears. All 9 cards inside require Alohomora — encoded at region level."

  Quidditch:
    entry: "Lumos & Flipendo & Rictusempra & 'Quidditch Key'"
    notes: "Quidditch training opens after Rictusempra challenge. Bean bonus room en route — no checks there. Fred/George vendor (Nimbus 2001, Quidditch armour) and Quidditch matches 1-6 are v2 Tier-3 expansion candidates."

  SkurgeChallenge:
    entry: "Lumos & Flipendo & Rictusempra & Skurge & 'Skurge Challenge Key'"
    notes: "Auto-teleport from Flitwick's classroom after the Skurge bookcase clears (bookcase TODO). Alohomora not at region entry because Skurge Challenge - Card Gregory doesn't need it; per-location for the other 5."

  BicornLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & 'Bicorn Level Key'"
    notes: "Bicorn horn collection level. Reached after Skurge challenge completion. v1: Bicorn itself is vanilla-only, not an AP item. All 6 cards inside require Alohomora. Dueling unlocks on completion (v2 Tier-3 candidate)."

  DuelingClub:
    entry: "Lumos & Flipendo & Rictusempra & Skurge & 'Duelling Key'"
    notes: "Dueling Club opens post-Bicorn (vanilla iGameState >= 80). 10 ranked duels (Rank 1-10) each fire an AP check on win. Region entry mirrors BicornLevel minus Alohomora (no locks to pick in the dueling room). v2 Tier-3 expansion, opt-in via enable_duelling (default off). Intra-rank ordering not encoded in logic per the 'spell/item requires only' rule — vanilla gameplay enforces sequential rank progression on its own."

  DiffindoChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Diffindo Challenge Key'"
    notes: "Auto-teleport from Sprout's classroom after the Diffindo bookcase clears (bookcase TODO). All 8 cards inside require Alohomora."

  BoomslangLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key'"
    notes: "Boomslang skin collection level. Reached after Diffindo challenge. v1: Boomslang itself is vanilla-only, not an AP item. Both cards require Alohomora."

  DumbledoreStudy:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo"
    notes: "Visited between Boomslang skin level and Goyle level. Story gate, not spell gate. Both cards require Alohomora."

  GoyleLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key'"
    notes: "Reached after Dumbledore's study. v1: BitOGoyle fragment at end is vanilla-only, not an AP check. All 6 cards require Alohomora."

  SlytherinCommon:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key'"
    notes: "Reached via Moaning Myrtle bathroom + Polyjuice transformation. v1: Polyjuice ingredients (Boomslang/Bicorn/BitOGoyle) are vanilla-only — story progression guarantees the player has them by the time they enter SlytherinCommon. All 5 cards require Alohomora."

  SpongifyChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Spongify Challenge Key'"
    notes: "Auto-teleport from Lockhart's classroom (DADA). No bookcase on the room because Rictusempra also lives here — Stefan's note: 'i cant place a bookcase there to block it yet'. All 8 cards require Alohomora."

  ForbiddenForest:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key' & 'Forbidden Forest Key'"
    notes: "All 6 cards require Alohomora."

  ChamberOfSecrets:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Chamber of Secrets Key'"
    notes: "Final goal region. All 4 non-starter spells required for traversal and Basilisk; Alohomora at region entry too. Hosts Chamber of Secrets - Card Elphick only — the 11 Gold cards moved to GoldCardRoom 2026-05-13 (correct vanilla home is Ch6WizardCard, not the Chamber level)."

  GoldCardRoom:
    entry: "@all_silver_cards"
    notes: "Ch6WizardCard.unr — the gold card vault, reached via a door in the Grand Staircase (Hogwarts sub-area). The room opens after collecting 40 silvers (= 4 gold keys); `@all_silver_cards` is expanded by gen_apworld.py to the AND of every items.yaml cards_silver name, so the gate cannot drift from the silver tier classification. HP2World.set_rules adds a separate fill-time placement constraint (no silver item may be PLACED in a gold-card location) that the rule grammar can't express."

# Per-location rules. KEY = location.name from locations.yaml.
# A location's effective rule is: region.entry AND location.requires.
# Many locations are "true" implicitly (just region access); only listed
# here when an extra requirement applies beyond the region entry.
locations:
  # ── Classrooms ─────────────────────────────────────────────────────────────
  # Each spell classroom has a bookcase (real or planned) requiring the spell
  # taught there, plus all earlier spells. The seed must place that spell at
  # some reachable location elsewhere for the bookcase to ever clear.
  "Learned Rictusempra":
    {
      requires: "Rictusempra",
      notes: "Bookcase removed when AP grants Rictusempra (already implemented). Alohomora not required per Stefan's playtest.",
    }
  "Learned Skurge":
    {
      requires: "Rictusempra & Skurge",
      notes: "Bookcase to be implemented. Alohomora not required per Stefan's playtest.",
    }
  "Learned Diffindo":
    {
      requires: "Alohomora & Rictusempra & Skurge & Diffindo",
      notes: "Bookcases to be implemented.",
    }
  "Learned Spongify":
    {
      requires: "Alohomora & Rictusempra & Skurge & Diffindo",
      notes: "Shares the DADA room with Rictusempra so a dedicated bookcase is impractical. Spongify itself is taught here so cannot gate.",
    }

  # Hogwarts cards (region entry: Lumos & Flipendo)
