  "Quidditch - Match 6 (Slytherin)":
    { requires: "Rictusempra & Skurge & Diffindo & Spongify & Alohomora" }

  # ── Gold Card Room cards ───────────────────────────────────────────────────
  # The GoldCardRoom region `entry` gates all 40 silvers, so the effective rule
  # per card is (all 40 silvers) AND (per-location requires below). The level
  # is replayable infinitely once the silver gate is met — already-AP-checked
  # gold cards on replay fire no-op CHECKs (deduped). `(Rictusempra | Spongify)`
  # captures the two alternate routes through the vault (Rictusempra-strike or
  # Spongify-bounce) the player can use.
  "Gold Card Room - Card Bott": { requires: "Rictusempra | Spongify" }
  "Gold Card Room - Card Dumbledore":
