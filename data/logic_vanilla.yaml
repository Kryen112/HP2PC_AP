    { requires: "Rictusempra & Skurge & Alohomora" }

  # ── Quidditch matches (region entry already requires Lumos+Flipendo+Rictusempra) ─
  # Placeholder `requires: "true"` per match. Real per-match gating to be
  # filled during Stefan's playthrough — matches unlock further into the
  # story (likely keyed to iGameState progression / story-spell ownership),
  # so later matches may need Skurge / Diffindo / Spongify on top of region
  # entry. Nimbus 2001 / Quidditch Armour are "useful" not "required" per
  # their classification, so they don't appear in the gating expressions.
  "Quidditch - Match 1 (Hufflepuff)": { requires: "Rictusempra" }
  "Quidditch - Match 2 (Ravenclaw)": { requires: "Rictusempra & Skurge" }
  "Quidditch - Match 3 (Slytherin)":
