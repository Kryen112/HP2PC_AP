# HP2PC_AP per-location access rules — source of truth.
#
# Every location in data/locations.yaml gets exactly one rule entry here.
# Rules express: "you can reach this location if you have these items."
#
# Schema:
#   <LocationName>:
#     requires: <expr>          # required items expression (see grammar below)
#     region:   <RegionName>    # what region you must be in (entry rule of region)
#     notes:    <free text>     # optional, why this rule
#
# Grammar for `requires`:
#   - "Flipendo"                       single item
#   - "Flipendo & Lumos"               AND
#   - "Flipendo | Alohomora"           OR
#   - "(Flipendo & Lumos) | BitOGoyle" parens + mix
#   - "true"                           always reachable from region (no extra requirement)
#   - "false"                          never reachable (placeholder during scaffolding)
#
# Authoring approach:
#   1. Generate a seed with `start_inventory_from_pool: all` (the AP "unlock everything"
#      option) and play through. Note which locations were physically blocked by what.
#   2. Encode each observation as a rule here.
#   3. Regenerate the apworld/*.py from data/*.yaml.
#   4. Generate a normal (non-unlock-all) seed; verify it's solvable.
#   5. Iterate.
#
# Spells default to precollected starters via the `starting_spells` yaml option
# (default Flipendo/Lumos/Alohomora). Lumos and Flipendo are encoded in every
# downstream region's entry rule because the Willow is impassable without them,
# so if a user opts them out of starting_spells the AP solver must place them
# early enough to remain reachable. Alohomora is listed explicitly per-location/
# region wherever it is actually required, so the logic stays honest about
# which locations depend on it when Alohomora isn't a starter.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:
    entry: "true"
    start: true

  WhompingWillow:
    entry: "true"

  EntryHall:
    entry: "Lumos & Flipendo"

  GrandStaircase:
    entry: "Lumos & Flipendo"

  CastleExterior:
    entry: "Lumos & Flipendo"

  RictusempraChallenge:
    entry: "Lumos & Flipendo & Rictusempra"

  Quidditch:
    entry: "Lumos & Flipendo & Rictusempra & 'Quidditch Key'"

  SkurgeChallenge:
    entry: "Lumos & Flipendo & Rictusempra & Skurge"

  BicornLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & 'Bicorn Level Key'"

  DuellingClub:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & 'Bicorn Level Key' & 'Duelling Key'"

  DiffindoChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key'"

  BoomslangLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key'"

  DumbledoreStudy:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key'"

  GoyleLevel:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key'"

  SlytherinCommon:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key'"

  SpongifyChallenge:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key'"

  ForbiddenForest:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key' & 'Forbidden Forest Key'"

  ChamberOfSecrets:
    entry: "Lumos & Flipendo & Alohomora & Rictusempra & Skurge & Diffindo & Spongify & 'Bicorn Level Key' & 'Boomslang Level Key' & 'Goyle Level Key' & 'Slytherin Common Room Key' & 'Forbidden Forest Key' & 'Chamber of Secrets Key'"

  GoldCardRoom:
    entry: "Lumos & Flipendo & @all_silver_cards"

  GryffindorChallenge:
    entry: "false"

