# HP2PC_AP OPEN CASTLE region entries + castle-hub location rules.
#
# Shared level-interior location rules live in data/logic_levels.yaml and are
# merged into this file by gen_apworld.py at gen time. This file holds every
# region's entry rule plus the per-location rules for the castle hubs (Entry
# Hall / Grand Staircase / Dumbledore's office / Castle Exterior); a location
# lives here OR in logic_levels, never both. Quidditch matches and duel ranks
# are implicitly "true" (region access suffices), so they are not listed.
# data/open_castle_playthrough_notes.yaml is the scratch pad these derive from.
#
# Schema:
#   regions:
#     <RegionName>:
#       entry: <expr>           # what's needed to make ANY progress in the region
#       notes: <free text>      # optional
#   locations:
#     <LocationName>:
#       requires: <expr>        # extra requirement ON TOP of region entry
#       notes: <free text>      # optional
#   goal:
#     <name>:
#       requires: <expr>
#
# Effective rule for a location = region.entry AND location.requires.
#
# Grammar for `entry` / `requires` (parsed by gen_apworld.parse_rule):
#   - Flipendo                         single-word item (bare token)
#   - 'Whomping Willow Key'            multi-word item MUST be single-quoted
#   - Flipendo & Lumos                 AND
#   - Rictusempra | Spongify           OR
#   - (Flipendo | Spongify) & Alohomora  parens + mix
#   - true                             always reachable from region
#   - false                            never reachable (scaffolding placeholder)
#
# Region `entry` carries only the open castle key plus any unavoidable physical
# gate (e.g. Spongify to traverse the Whomping Willow). The full per-location
# spell combo lives in each location's `requires`. Locations whose only
# requirement is region entry are omitted (implicitly "true") — Quidditch
# matches, Duelling ranks, and a handful of secrets/cards/vendors are in that
# bucket.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:
    entry: "true"
    start: true

  WhompingWillow:
    entry: "'Whomping Willow Key' & Spongify"

  EntryHall:
    entry: "true"

  GrandStaircase:
    entry: "true"

  CastleExterior:
    entry: "true"

  GoldCardRoom:
    entry: "@silver_cards_at_least_20"

  RictusempraChallenge:
    entry: "'Rictusempra Challenge Key'"

  Quidditch:
    entry: "'Quidditch Key' | Running"

  SkurgeChallenge:
    entry: "'Skurge Challenge Key' & Skurge"

  BicornLevel:
    entry: "'Bicorn Level Key' & Skurge"

  DuellingClub:
    entry: "'Duelling Key'"

  DiffindoChallenge:
    entry: "'Diffindo Challenge Key' & Diffindo"

  BoomslangLevel:
    entry: "'Boomslang Level Key' & Diffindo"

  DumbledoreStudy:
    entry: "Alohomora"

  GoyleLevel:
    entry: "'Goyle Level Key'"

  SlytherinCommon:
    entry: "'Slytherin Common Room Key'"

  SpongifyChallenge:
    entry: "'Spongify Challenge Key'"

  ForbiddenForest:
    entry: "'Forbidden Forest Key'"

  ChamberOfSecrets:
    entry: "'Chamber of Secrets Key' & Alohomora"

  GryffindorChallenge:
    entry: "'Gryffindor Challenge Key'"

  # Open-castle bonus bean room, reached via the mod-spawned bean-room entry.
  # Baseline entry true (refine later); in OPEN_CASTLE_ONLY_REGIONS so it is
  # vanilla-disabled. Its containers gate on their opening spell per-row.
  BeanBonusRoom:
    entry: "true"

