# HP2PC_AP shared level-interior access rules, used by BOTH game modes.
#
# Per-location requirements INSIDE the discrete level / challenge maps, which
# are identical between the vanilla and open castle distributions. gen_apworld.py
# merges this file's `locations:` into both logic_vanilla.yaml and
# logic_open_castle.yaml. Region entry rules and the castle-hub (Entry Hall /
# Grand Staircase / Dumbledore's office / Castle Exterior) + Quidditch location
# rules are mode-specific and live in the per-mode files.
#
# Values are sourced from the open-castle playthrough logic (the honest
# intra-level requirement; the vanilla region entry re-imposes the story chain
# on top). A location listed here must NOT also appear in a mode file.
# gen_apworld errors on overlap.

