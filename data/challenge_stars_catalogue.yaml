# HP2PC_AP challenge-stars catalogue — captured from in-game logging pass on 2026-05-12.
#
# Source-of-truth list of every ChallengeStar in the 4 spell-challenge levels.
# Mirrors the schema of secrets_catalogue.yaml; intended for the same v2
# location-expansion workflow (catalogue first, fill per-star `requires:`
# during a combined playthrough, then convert to real locations.yaml rows and
# wire up the mod-side ChallengeStar marker).
#
# Status: cataloguing complete (44 entries) and id_offsets pinned (500..543,
# locations.yaml base 5760000 → AP ids 5760500..5760543). The gap between
# secrets (300..409) and stars (500..543) is intentional — reserves 410..499
# for any future check categories that should sit between these two.
#
# No ChallengeStarFinal actors exist in any of the 4 levels — the level-exit
# trigger is handled elsewhere by ChallengeScoreManager / SpellChallengeTrigger,
# not by a distinct final-star prop. So all stars in this file are regular
# ChallengeStar instances and are numbered straight 1..N per level (no
# "Final" suffix row).
#
# Mod-side wiring plan (hybrid detection — see also secrets_catalogue.yaml):
#   - Approach: subclass replacement, NOT poller. ChallengeStar is a Touch
#     pickup with no persistent flag — vanilla destroys the actor on collect.
#     The replacement marker carries the AP location id as a defaultprop.
#   - Hookpoint: at APGameInfo.InitGame, for each ChallengeStar in the
#     current level look up (LevelName, MarkerName) → LocationId from the
#     gen_apworld.py-emitted registry. Destroy the vanilla star and Spawn
#     APChallengeStarMarker at the same Location/Rotation/Tag, with
#     CheckLocationId set on the spawned instance. Mirrors how
#     APCardMarker_<X> replaces vanilla WizardCardIcon subclasses today.
#   - PickupProp.EndState override: call Super (preserves vanilla
#     PickedUpStar() → ChallengeScoreManager score increment) THEN fire
#     CHECK_LOCATION via APIPCActor. Order matters — never block the score
#     update or the player loses points for a star they "earned".
#   - Replay handling: at PostBeginPlay the marker self-destroys if
#     LocationChecked[CheckLocationId]==1, so a re-entered challenge level
#     shows N-k stars instead of N (k = how many you've already AP-checked).
#     Matches APCardMarker behavior for replayable card locations. Acceptable
#     because score targets are tuned with margin; missing a few stars on
#     a victory-lap rerun is intentional.
#
# Schema per entry (matches secrets_catalogue.yaml):
#   id_offset Stable AP location id. Final id = locations.yaml base_id +
#             id_offset. Stars occupy 500..543 (44 entries). Once a seed
#             ships, this id is immutable forever.
#   name      AP location display name. Format: "<Region display> - Challenge Star <N>".
#             N is a stable per-region sequence sorted by marker index ascending.
#             Treat N as opaque — it doesn't correspond to any in-game ordering
#             the player would notice.
#   level     Source .unr file (always one of the 4 challenge levels).
#   marker    UE actor Name (e.g. ChallengeStar0). Stable per .unr. Note that
#             marker indices are not always contiguous: Ch1Rictusempra skips
#             markers 9 and 10, Ch2Skurge skips 3 and 5 (presumably deleted in
#             the editor at some point). We catalogue what AllActors returned,
#             not the gaps.
#   tag      UE actor Tag. Mostly "ChallengeStar" (the default); Ricta has
#             two oddballs — "ChallengeStar01"/"ChallengeStar02" on the first
#             two markers and "PuzzleRoomStar" on the puzzle-room star — kept
#             here for human reference. Tag is not used by the mod's marker
#             plan (we match on Class + Name).
#   loc       (x, y, z) world coords from the catalogue dump. Helpful for
#             remembering "oh, that's the one near the entrance".
#   missable  Always false — all 4 challenge levels are replayable, so stars
#             always allow progression in `requires:` placements.
#   requires  Spells/items needed in-logic to reach this specific star.
#             Leave as null while cataloguing; fill in during playthrough.
#             Empty list = floor only (just whatever's needed to enter the
#             challenge — i.e. the spell the challenge is named after).
#             Examples once filled: [Lumos], [Flipendo, Spongify].
#
# Total: 44 stars across 4 regions. 0 missable (all replayable).

