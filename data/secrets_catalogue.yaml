# HP2PC_AP secrets catalogue — captured from in-game logging pass on 2026-05-12.
#
# This file is the source-of-truth list of every SecretAreaMarker in HP2 that
# we want to expose as an AP check (v2 feature, not shipped in v1.0.0).
#
# Status: cataloguing complete (110 entries). Per-secret `requires:` is still
# TODO — Stefan will fill those in during a combined secrets + challenge-stars
# playthrough. Once `requires:` is populated, these entries get converted into
# real locations.yaml rows and the mod-side SecretAreaMarker poller gets wired
# up (see DESIGN.md v2 plan: bFound polling in APCardWatcher snapshot loop).
#
# Schema per entry:
#   name      AP location display name. Format: "<Region display> - Secret <N>".
#             N is a stable per-region sequence (alphabetical by source level,
#             then by marker name within a level). Treat N as an opaque id —
#             it doesn't correspond to any in-game ordering.
#   level     Source .unr file(s). For Castle Exterior, Grounds_hub and
#             Grounds_Night are merged: same physical secret picked up in
#             either day or night version fires the same AP check. Mod uses
#             canonical key = (strip "_Night" and ".unr" from level, marker).
#   marker    UE actor Name (e.g. SecretAreaMarker0). Stable per .unr.
#   tag       UE actor Tag. Mostly "SecretAreaMarker" (the default); some
#             levels have meaningful tags like "FountainSecretReveal" or
#             "WanderingBridgeRewardDoor" — kept here for human reference.
#   loc       (x, y, z) world coords from the catalogue dump. Helpful for
#             remembering "oh, that's the one near the fountain".
#   missable  true if the secret lives in an un-replayable level (Willow,
#             Bicorn, Boomslang, Goyle, Slytherin Common, Forest, Chamber).
#             When YAML option `allow_secrets_progression: false` (default),
#             missable secrets get the IsFiller rule restriction so they only
#             hold beans. Replayable secrets (Hogwarts, Castle Exterior, the
#             4 spell-challenge levels) always allow progression.
#   requires  Spells/items needed in-logic to reach this specific secret.
#             Leave as null while cataloguing; fill in during playthrough.
#             Empty list = floor only (just whatever's needed to enter the
#             level). Examples once filled: [Lumos], [Flipendo, Spongify].
#
# Total: 110 secrets across 13 regions. 39 missable, 71 replayable.

