# HP2PC_AP per-location access rules — BINGO mode source of truth.
#
# Each rule is the spell/item combo needed to physically reach that location
# in bingo mode. data/bingo_playthrough_notes.yaml is the human-readable
# scratch pad these are derived from.
#
# Schema:
#   regions:
#     <RegionName>:
#       entry: <expr>           # what's needed to make ANY progress in the region
#       notes: <free text>      # optional
#   locations:
#     <LocationName>:
#       requires: <expr>        # extra requirement ON TOP of region entry
#       notes: <free text>      # optional
#   goal:
#     <name>:
#       requires: <expr>
#
# Effective rule for a location = region.entry AND location.requires.
#
# Grammar for `entry` / `requires` (parsed by gen_apworld.parse_rule):
#   - Flipendo                         single-word item (bare token)
#   - 'Whomping Willow Key'            multi-word item MUST be single-quoted
#   - Flipendo & Lumos                 AND
#   - Rictusempra | Spongify           OR
#   - (Flipendo | Spongify) & Alohomora  parens + mix
#   - true                             always reachable from region
#   - false                            never reachable (scaffolding placeholder)
#
# Region `entry` carries only the bingo key plus any unavoidable physical
# gate (e.g. Spongify to traverse the Whomping Willow). The full per-location
# spell combo lives in each location's `requires`. Locations whose only
# requirement is region entry are omitted (implicitly "true") — Quidditch
# matches, Dueling ranks, and a handful of secrets/cards/vendors are in that
# bucket.

# Regions — entry rules. Locations inherit region access; their own `requires`
# adds extra requirements on top.
regions:
  Menu:
    entry: "true"
    start: true

  WhompingWillow:
    entry: "'Whomping Willow Key' & Spongify"
    notes: "Starting level. Bingo key auto-precollected in vanilla mode. Spongify is an unavoidable physical traversal gate to reach any check inside."

  Hogwarts:
    entry: "true"
    notes: "Castle interior hub — grand staircase, classrooms, entrance hall, library. Sphere-0 in bingo (open castle, walkable with no spells)."

  CastleExterior:
    entry: "true"
    notes: "Outdoor courtyard between castle and greenhouses. Sphere-0 in bingo."

  GoldCardRoom:
    entry: "@all_silver_cards"
    notes: "Ch6WizardCard.unr — gold card vault, reached via a Grand Staircase door. The room opens after collecting 40 silvers (= 4 gold keys); `@all_silver_cards` is expanded by gen_apworld.py to the AND of every items.yaml cards_silver name, so the gate cannot drift from the silver tier classification. HP2World.set_rules adds a separate fill-time placement constraint (no silver item may be PLACED in a gold-card location) that the rule grammar can't express."

  RictusempraChallenge:
    entry: "'Rictusempra Challenge Key'"
    notes: "Auto-teleport from Lockhart's classroom after the Rictusempra bookcase clears."

  Quidditch:
    entry: "'Quidditch Key'"
    notes: "All 6 matches reachable on region entry alone — no extra per-match spell requirement."

  SkurgeChallenge:
    entry: "'Skurge Challenge Key' & Skurge"
    notes: "Auto-teleport from Flitwick's classroom after the Skurge bookcase clears."

  BicornLevel:
    entry: "'Bicorn Level Key' & Skurge"
    notes: "Bicorn horn collection level, after Skurge challenge. v1: Bicorn itself is vanilla-only, not an AP item."

  DuelingClub:
    entry: "'Duelling Key'"
    notes: "All 10 ranked duels reachable on region entry alone — no extra per-rank spell requirement. Canonical key item name is 'Duelling Key' (items.yaml:190). v2 Tier-3, opt-in via enable_duelling."

  DiffindoChallenge:
    entry: "'Diffindo Challenge Key' & Diffindo"
    notes: "Auto-teleport from Sprout's classroom after the Diffindo bookcase clears."

  BoomslangLevel:
    entry: "'Boomslang Level Key' & Diffindo"
    notes: "Boomslang skin level, after Diffindo challenge. v1: Boomslang itself is vanilla-only."

  DumbledoreStudy:
    entry: "Alohomora"
    notes: "Between Boomslang skin level and Goyle level. Alohomora is the physical gate to reach the region's checks."

  GoyleLevel:
    entry: "'Goyle Level Key'"
    notes: "After Dumbledore's study. v1: BitOGoyle fragment is vanilla-only, not an AP check."

  SlytherinCommon:
    entry: "'Slytherin Common Room Key'"
    notes: "Via Moaning Myrtle bathroom + Polyjuice. v1: Polyjuice ingredients are vanilla-only story progression."

  SpongifyChallenge:
    entry: "'Spongify Challenge Key'"
    notes: "Auto-teleport from Lockhart's classroom (DADA). Shares the room with Rictusempra so no dedicated bookcase."

  ForbiddenForest:
    entry: "'Forbidden Forest Key'"
    notes: "Late-game forest level."

  ChamberOfSecrets:
    entry: "'Chamber of Secrets Key' & Alohomora"
    notes: "Final goal region. Hosts Chamber of Secrets - Card Elphick + 6 secrets; the 11 Gold cards live in GoldCardRoom."

  GryffindorChallenge:
    entry: "'Gryffindor Challenge Key'"
    notes: "Bingo-only challenge level (Ch7Gryffindor), entered from the Entryhall_hub Gryffindor bookcase. The vanilla give-all-spells actor (TriggerTurnOnAllSpells) is neutralized at level-init so spells stay AP-controlled. Entry carries only the key; per-star spell combos live in each location's requires."

