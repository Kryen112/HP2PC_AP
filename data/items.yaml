  - { id_offset: 263, name: "Gryffindor Challenge Key",  classification: progression, group: "Blocker Keys" }

# Filler. Stacks — multiple copies allowed, count adjusted at generation time
# to exactly fill the location-pool delta (locations - non-filler items).
filler:
  # Bean denominations. The small ones (1/5/10) carry the bulk of the bean
  # weight so most bean drops are tiny; the Pile tiers are trimmed and the
  # big ones stay sparse premiums. APPEND new filler at the END only — the
  # mod's appearance codes are 2001 + index in this list (Client.py
  # FILLER_CODE), so inserting mid-list would renumber 2001..2008.
  - { id_offset: 300, name: "Small Jar of Beans",   classification: filler, group: Filler, weight: 7,  notes: "Grants ~25 beans" }
  - { id_offset: 301, name: "Medium Jar of Beans",  classification: filler, group: Filler, weight: 4,  notes: "Grants ~50 beans" }
  - { id_offset: 302, name: "Large Jar of Beans",   classification: filler, group: Filler, weight: 2,  notes: "Grants ~100 beans" }
  - { id_offset: 303, name: "Massive Jar of Beans", classification: filler, group: Filler, weight: 1,  notes: "Sparse premium. Grants ~250 beans" }
  - { id_offset: 304, name: "Wiggenweld Potion",     classification: filler, group: Filler, weight: 1,  notes: "Sparse premium. Full health refill on grant" }
  - { id_offset: 305, name: "Wiggentree Bark",       classification: filler, group: Filler, weight: 3,  notes: "Wiggenweld brewing ingredient (+1 in inventory)" }
  - { id_offset: 306, name: "Flobberworm Mucous",    classification: filler, group: Filler, weight: 3,  notes: "Wiggenweld brewing ingredient (+1 in inventory)" }
  - { id_offset: 307, name: "Chocolate Frog",        classification: filler, group: Filler, weight: 7,  notes: "Health refill on grant" }
  - { id_offset: 308, name: "1 Bean",                classification: filler, group: Filler, weight: 6,  notes: "Grants 1 bean" }
  - { id_offset: 309, name: "5 Beans",               classification: filler, group: Filler, weight: 8,  notes: "Grants 5 beans" }
  - { id_offset: 310, name: "10 Beans",              classification: filler, group: Filler, weight: 8,  notes: "Grants 10 beans" }

# Negative "trap" items (AP ItemClassification.trap). Opt-in: only generated
# when the `enable_traps` YAML option is on, replacing a `trap_fill_percent`
# fraction of the filler delta (item/location balance unchanged — same math as
# filler). All grant-driven, dispatched by APGameInfo.TryApplyTrap on the
# GRANT line; one-shot (the client's AP-Data-Storage consumed-index
# ledger marks each applied trap so it never re-fires on reconnect /
# save-load — only a genuine new game replays it); self-terminating
# (instant / level-load revert / timer). id band
# 400-404. 401 (Peeves) and 402 (Spider Swarm)
# are retired: this M212 open castle build does not render an ad-hoc visible
# world actor spawned mid-level. Those ids are never reused.
traps:
  - { id_offset: 400, name: "Bean Thief Trap",            classification: trap, group: Traps, notes: "Steals up to 200 beans (clamped at 0); routed through RingLink's no-broadcast bean helper so it stays local. Permanent by design." }
  - { id_offset: 403, name: "Goyle Transformation Trap",  classification: trap, group: Traps, notes: "harry.bIsGoyle=True + SetNewMesh(); reverts on the next level's fresh pawn." }
  - { id_offset: 404, name: "Forgetfulness Trap",         classification: trap, group: Traps, notes: "Backs up + clears harry.SpellBook[]; restored on a timer or the next level transition, whichever comes first." }
