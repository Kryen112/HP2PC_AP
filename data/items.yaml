# HP2PC_AP item catalog — source of truth.
#
# Each item appears EXACTLY ONCE in the multiworld pool. AP item IDs are stable
# integers; once assigned, never change them (it would break old seeds).
#
# Schema:
#   id            unique AP item id (offset from base 5750000)
#   name          display name (also used as the in-game string)
#   classification: progression | useful | filler | trap
#   group         grouping for AP/yaml category options (e.g. "Cards (Bronze)")
#   notes         free text, optional
#
# Total: 110 unique items + 11 filler types + 3 trap types = 124 entries
# (filler/traps stack as needed).
# Filler `weight:` is the relative frequency when the generator picks a filler
# item via get_filler_item_name (multiworld.random.choices). Probabilities are
# weight / sum(weights). Sum across the 11 filler types = 50; example expected
# counts over a 154-slot fill (110 secrets + 44 stars): weight 1 → ~3 picks,
# weight 3 → ~9, weight 7 → ~22,
# weight 8 → ~25.

base_id: 5750000

spells:
  - { id_offset: 1, name: Alohomora,  classification: progression, group: Spells }
  - { id_offset: 2, name: Diffindo,   classification: progression, group: Spells }
  - { id_offset: 3, name: Flipendo,   classification: progression, group: Spells }
  - { id_offset: 4, name: Lumos,      classification: progression, group: Spells }
  - { id_offset: 5, name: Rictusempra,classification: progression, group: Spells }
  - { id_offset: 6, name: Skurge,     classification: progression, group: Spells }
  - { id_offset: 7, name: Spongify,   classification: progression, group: Spells }

# 2 unique pieces of Quidditch equipment sold by Fred & George on the vanilla
# Castle Exterior grounds (post-Rictusempra spawn gate). Randomized as
# "useful" items: useful for the Quidditch progression sub-track but not
# strictly required for the Basilisk goal. Each is a one-time purchase.
#
# Generation gate: this entire section is paired with the
# `quidditch_purchases` section in data/locations.yaml under the
# `enable_quidditch_upgrades` YAML option (Toggle, default off). When the
# option is false, gen_apworld.py MUST skip both these items AND the two
# matching locations together — leaving them unpaired would produce a 2-item
# item-vs-location mismatch in the pool. The pairing is items 8/9 ↔ locations 5/6.
#
# Grant handlers in APGameInfo.ApplyGrant set the corresponding harry.bHaveX
# flag plus increment the StatusGroupQGear status item so the HUD updates.
equipment:
  - { id_offset: 8, name: "Nimbus 2001",      classification: useful, group: Equipment, notes: "Fred Weasley vendor in Quidditch courtyard, ~700 beans in vanilla. Grant sets harry.bHaveNimbus2001 = True (mirrors Characters.uc:631)." }
  - { id_offset: 9, name: "Quidditch Armour", classification: useful, group: Equipment, notes: "George Weasley vendor. Grant sets harry.bHaveQArmor = True (mirrors Characters.uc:635)." }

# Boomslang / Bicorn / BitOGoyle are NOT randomized. They flow through
# vanilla story progression. Add back when the key-item AP path is reliable
# (mod hook for goyle-bump trigger, vendor behaviour after missed pickup, etc).
key_items: []

