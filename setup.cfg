[flake8]
# Mirrors Archipelago's CI lint (.github/workflows/analyze-modified-files.yml):
# the hard gate is E9,F63,F7,F82 (syntax errors + undefined names); the soft
# pass uses these limits. 120 columns per docs/style.md.
max-line-length = 120
max-doc-length = 120
max-complexity = 14
# Generated data tables carry an "Auto-generated" banner and are regenerated
# from data/*.yaml by gen_apworld.py; they are not hand-maintained source, so
# they are not linted as such. extend-exclude keeps flake8's own defaults.
extend-exclude =
    apworld/items.py,
    apworld/locations.py,
    apworld/regions.py,
    apworld/rules.py
# Client.py installs a warnings filter that must run before `import CommonClient`,
# so its module imports legitimately sit below that statement.
per-file-ignores =
    apworld/Client.py: E402
