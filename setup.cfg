[flake8]
# Mirrors Archipelago's CI lint (.github/workflows/analyze-modified-files.yml):
# the hard gate is E9,F63,F7,F82 (syntax errors + undefined names); the soft
# pass uses these limits. 120 columns per docs/style.md.
max-line-length = 120
max-doc-length = 120
max-complexity = 14

# Client.py installs a warnings filter that must run before `import CommonClient`,
# so its module imports legitimately sit below that statement. capture_mod.py
# and check_mod_manifest.py put the repo root on sys.path before importing
# build_apworld.
per-file-ignores =
    apworld/Client.py: E402
    scripts/capture_mod.py: E402
    scripts/check_mod_manifest.py: E402
