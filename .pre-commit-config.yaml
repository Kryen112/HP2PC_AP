# Pre-commit gate: hygiene, lint (check-only), the mod/package drift check,
# and the world's own tests.
# Install once with:  pip install pre-commit  &&  pre-commit install
# Run on demand with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        # Sized to admit the committed compiled mod package (mod/Compiled/
        # HPArchipelago.u, ~1.3 MB).
        args: [--maxkb=2048]

  - repo: https://github.com/pycqa/flake8
    rev: 7.2.0
    hooks:
      # Reads setup.cfg, lints only the changed .py files. No auto-fix.
      - id: flake8

  - repo: local
    hooks:
      # Any commit touching the mod must keep source and the canonical
      # compiled package in step (drift can only enter through mod/ changes).
      - id: mod-manifest
        name: mod / compiled package drift check
        entry: python scripts/check_mod_manifest.py
        language: system
        pass_filenames: false
        files: ^mod/
      - id: world-tests
        name: world tests (pytest)
        entry: python scripts/run_world_tests.py
        language: system
        pass_filenames: false
        files: ^apworld/.*\.py$
