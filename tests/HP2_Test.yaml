name: HP2_Test
description: HP2 full-playthrough seed for logic cataloguing
game: Harry Potter 2
Harry Potter 2:
  # Starter spells: Lumos/Flipendo/Alohomora are cutscene-granted in the early
  # game and the watcher baselines them as already-AP-granted (no revert). For
  # AP gen to consider them "owned" when evaluating logic, give them as start
  # inventory pulled from the pool — leaves 4 random spells in the pool.
  start_inventory_from_pool:
    Lumos: 1
    Flipendo: 1
    Alohomora: 1
  # Plando each classroom to teach its own spell. Without this, walking into a
  # classroom auto-teleports to the spell challenge with the exit locked behind;
  # if the player doesn't already own the spell (because we revert vanilla
  # cutscene grants for non-starter spells) they softlock. v2 fix is to unlock
  # the door via UScript; for v1 playthrough the workaround is to make each
  # spell its own classroom's reward.
  plando_items:
    - item: Rictusempra
      location: Classroom_Lockhart_Rictusempra
      from_pool: true
      force: silent
    - item: Skurge
      location: Classroom_Flitwick_Skurge
      from_pool: true
      force: silent
    - item: Diffindo
      location: Classroom_Sprout_Diffindo
      from_pool: true
      force: silent
    - item: Spongify
      location: Classroom_Lockhart_Spongify
      from_pool: true
      force: silent
