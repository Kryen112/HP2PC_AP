name: HP2_Test
description: HP2 full-playthrough seed for logic cataloguing
game: Harry Potter 2 PC
Harry Potter 2 PC:
  # Lumos/Flipendo/Alohomora are mandatory precollected starter spells in the
  # APWorld now, because v1 has 108 checks and 111 unique non-filler items.
  # Plando each classroom to teach its own spell. Without this, walking into a
  # classroom auto-teleports to the spell challenge with the exit locked behind;
  # if the player doesn't already own the spell (because we revert vanilla
  # cutscene grants for non-starter spells) they softlock. v2 fix is to unlock
  # the door via UScript; for v1 playthrough the workaround is to make each
  # spell its own classroom's reward.
  plando_items:
    - item: Rictusempra
      location: "Learned Rictusempra"
      from_pool: true
      force: silent
    - item: Skurge
      location: "Learned Skurge"
      from_pool: true
      force: silent
    - item: Diffindo
      location: "Learned Diffindo"
      from_pool: true
      force: silent
    - item: Spongify
      location: "Learned Spongify"
      from_pool: true
      force: silent
    # v1: Boomslang/Bicorn/BitOGoyle plando entries removed. These items are
    # no longer in the AP pool — they flow through vanilla story progression.
