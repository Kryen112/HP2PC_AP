<?xml version="1.0" encoding="UTF-8"?>
<!--
  Archipelago six-circle rosette (APLogoTex0 = 9000 foreign plain).
  Colours/positions sampled from the official logo supplied by the user.
  256x256 = target PNG canvas. Background transparent here; the masked PNG
  export keys out pure-black/alpha-0 (Style=STY_Masked), so the six discs
  and the black hub/gaps between them are exactly the intended look.
  Hexagon ring radius R=84, disc radius r=38, centre (128,128).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g>
    <circle cx="128.0" cy="44.0"  r="38" fill="#CA7682"/> <!-- top:        rose   -->
    <circle cx="200.7" cy="86.0"  r="38" fill="#75C175"/> <!-- upper-right: green  -->
    <circle cx="200.7" cy="170.0" r="38" fill="#CA95C2"/> <!-- lower-right: purple -->
    <circle cx="128.0" cy="212.0" r="38" fill="#DAA07D"/> <!-- bottom:      tan    -->
    <circle cx="55.3"  cy="170.0" r="38" fill="#767EBD"/> <!-- lower-left:  blue   -->
    <circle cx="55.3"  cy="86.0"  r="38" fill="#EDE491"/> <!-- upper-left:  yellow -->
  </g>
</svg>
